function loadState(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x?Object.assign(structuredClone(defaultState),x):structuredClone(defaultState)}catch{return structuredClone(defaultState)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function esc(s=''){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmt(sec=0){sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return +d}
function hist(){return state.history.filter(x=>x.type==='practice')}
function secOf(h){return Number(h.seconds||0)}
function weekSec(){return hist().filter(h=>h.at>=weekStart()).reduce((a,h)=>a+secOf(h),0)}
function totalSec(){return hist().reduce((a,h)=>a+secOf(h),0)}
function catSecs(){const o={};hist().filter(h=>h.at>=weekStart()).forEach(h=>o[h.category]=(o[h.category]||0)+secOf(h));return o}
function streak(){const days=new Set(hist().filter(h=>h.seconds>2).map(h=>new Date(h.at).toISOString().slice(0,10)));let d=new Date(),n=0;d.setHours(12,0,0,0);if(!days.has(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);while(days.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
function card(e){const bpm=state.bpms[e.id]||e.bpm;return `<button class="card exercise" data-ex="${e.id}"><div class="title">${esc(e.title)}</div><div class="sub">${esc(e.category)} · ${bpm} BPM · Richtwert ${e.minutes} min</div><div class="pillrow"><span class="pill">${esc(e.level)}</span>${e.jam?`<span class="pill">Backing Track</span>`:''}</div></button>`}
function headerBar(title='PLAY. guitar',sub='Practice that actually counts.'){return `<div class="top"><div><div class="brand">${title}</div><div class="subtitle">${sub}</div></div><button class="iconbtn" data-settings>⚙︎</button></div>`}
function nav(){const tabs=[['today','⌂','Heute'],['practice','♬','Übungen'],['jam','▶','Jam'],['history','◫','Verlauf'],['tools','⚙','Tools']];return `<nav class="nav">${tabs.map(([id,ic,l])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}"><b>${ic}</b>${l}</button>`).join('')}</nav>`}
function recomm(){const spent=catSecs(), cats=['Warm-up','Alternate Picking','String Crossing','Rhythm & Chords','Skalen','Sequenzen','Blues Licks','Legato','Arpeggios','Style Riffs','Expression'];const recent=hist().slice(-40);return cats.map((c,i)=>({c,score:(spent[c]||0)+recent.filter(h=>h.category===c&&h.rating==='easy').length*120-recent.filter(h=>h.category===c&&h.rating==='hard').length*180+i*3})).sort((a,b)=>a.score-b.score)}
function makeSession(){const target=+state.profile.minutes||20, rec=recomm(),items=[];let planned=0;for(const r of rec){let pool=EX.filter(e=>e.category===r.c);if(!pool.length)continue;pool=pool.sort((a,b)=>(state.favorites[b.id]?1:0)-(state.favorites[a.id]?1:0)||Math.random()-.5);const e=pool[0];if(items.some(x=>x.id===e.id))continue;if(items.length&&planned+e.minutes>target+3)continue;items.push(e);planned+=e.minutes;if(planned>=target-2||items.length>=6)break}return items}
function today(){const s=state.activeSession?.items?.length?state.activeSession.items.map(i=>EX.find(e=>e.id===i.id)).filter(Boolean):makeSession();return `${headerBar()}<section class="hero"><div class="eyebrow">Empfehlung · ca. ${state.profile.minutes} Minuten</div><h1>${state.activeSession?'Session fortsetzen':'Heute gezielt üben'}</h1><p>${hist().length?`Diese Woche ${fmt(weekSec())} echte Spielzeit. Heute priorisiert die App Bereiche, die du wenig geübt oder zuletzt als schwer bewertet hast.`:'Noch keine Daten: Die erste Session ist bewusst ausgewogen. Gezählt wird nur aktive Übungszeit.'}</p><button class="primary" data-session>▶ ${state.activeSession?'Fortsetzen':'Session starten'}</button></section><div class="stats"><div class="stat"><strong>${streak()}🔥</strong><span>Streak</span></div><div class="stat"><strong>${fmt(weekSec())}</strong><span>diese Woche</span></div><div class="stat"><strong>${s.length}</strong><span>Übungen heute</span></div></div><div class="sectionhead"><h2>Heute sinnvoll</h2><button data-tab="practice">Alle Übungen</button></div><div class="grid">${s.slice(0,6).map(card).join('')}</div>`}
let filter='Alle', query='';
function practice(){const cats=['Alle',...new Set(EX.map(e=>e.category))];let list=EX.filter(e=>(filter==='Alle'||e.category===filter)&&(!query||(`${e.title} ${e.category} ${e.tags.join(' ')}`).toLowerCase().includes(query.toLowerCase())));return `${headerBar('PLAY. practice',`${EX.length} kuratierte Drills & Riffs`)}<input class="search" placeholder="Übung suchen…" value="${esc(query)}" data-search><div class="filters">${cats.map(c=>`<button data-filter="${esc(c)}" class="${filter===c?'active':''}">${esc(c)}</button>`).join('')}</div><div class="sectionhead"><h2>${esc(filter)}</h2><button data-random>Zufällig</button></div><div class="grid">${list.map(card).join('')||'<div class="empty">Keine Treffer.</div>'}</div>`}
function jam(){return `${headerBar('PLAY. jam','Backing Tracks direkt in der PWA')}<div class="grid">${JAMS.map(j=>`<button class="card exercise" data-jam="${j.id}"><div class="title">${esc(j.name)}</div><div class="sub">${esc(j.style)} · ${j.bpm} BPM · ${esc(j.key)}</div><p class="sub">${esc(j.desc)}</p></button>`).join('')}</div>`}
function history(){const cats=Object.entries(catSecs()).sort((a,b)=>b[1]-a[1]), recent=hist().slice(-30).reverse();const max=Math.max(1,...cats.map(x=>x[1]));return `${headerBar('PLAY. progress','Echte aktive Übungszeit')}<div class="stats"><div class="stat"><strong>${fmt(totalSec())}</strong><span>gesamt</span></div><div class="stat"><strong>${fmt(weekSec())}</strong><span>diese Woche</span></div><div class="stat"><strong>${hist().length}</strong><span>Durchgänge</span></div></div><div class="sectionhead"><h2>Diese Woche nach Bereich</h2></div><div class="card">${cats.length?cats.map(([c,s])=>`<div class="history"><div class="grow"><b>${esc(c)}</b><div class="bar"><i style="width:${Math.round(s/max*100)}%"></i></div></div><strong>${fmt(s)}</strong></div>`).join(''):'<div class="empty">Noch keine Practice-Zeit.</div>'}</div><div class="sectionhead"><h2>Letzte Durchgänge</h2></div><div class="card">${recent.length?recent.map(h=>`<div class="history"><div><b>${esc(h.title)}</b><small>${esc(h.category)} · ${new Date(h.at).toLocaleDateString('de-DE')}</small></div><strong>${fmt(h.seconds)}</strong></div>`).join(''):'<div class="empty">Noch kein Verlauf.</div>'}</div>`}
function tools(){return `${headerBar('PLAY. tools','Werkzeuge ohne extra App')}<div class="toolgrid"><button class="card toolcard" data-tool="metro"><div class="title">Metronom</div><div class="sub">BPM, Start/Stop, Tap</div></button><button class="card toolcard" data-tool="tuner"><div class="title">Tuner</div><div class="sub">Mikrofon-Tonhöhenanzeige</div></button><button class="card toolcard" data-tool="timer"><div class="title">Freier Practice Timer</div><div class="sub">Zeit als Free Practice speichern</div></button><button class="card toolcard" data-tool="backup"><div class="title">Backup</div><div class="sub">JSON Export / Import</div></button></div>`}
function render(){const root=document.getElementById('app');root.innerHTML=`<main class="app">${state.tab==='today'?today():state.tab==='practice'?practice():state.tab==='jam'?jam():state.tab==='history'?history():tools()}</main>${nav()}`;bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{const same=state.tab===b.dataset.tab;state.tab=b.dataset.tab;save();render();requestAnimationFrame(()=>scrollTo(0,0));});document.querySelector('[data-settings]')?.addEventListener('click',settings);document.querySelector('[data-session]')?.addEventListener('click',openSession);document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>openExercise(b.dataset.ex));document.querySelectorAll('[data-jam]').forEach(b=>b.onclick=()=>openJam(b.dataset.jam));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelector('[data-search]')?.addEventListener('input',e=>{query=e.target.value;render();setTimeout(()=>document.querySelector('[data-search]')?.focus(),0)});document.querySelector('[data-random]')?.addEventListener('click',()=>openExercise(EX[Math.floor(Math.random()*EX.length)].id));document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>openTool(b.dataset.tool))}
function sheet(html){const d=document.createElement('div');d.className='sheet';d.innerHTML=`<div class="panel"><div class="handle"></div>${html}</div>`;document.body.appendChild(d);d.addEventListener('click',e=>{if(e.target===d)closeSheet(d)});d.querySelector('[data-close]')?.addEventListener('click',()=>closeSheet(d));return d}
function closeSheet(d){if(d?._beforeClose)d._beforeClose();stopAudio();d?.remove()}
function trackerStart(meta){trackerStop(true);active={...meta,running:true,start:performance.now(),acc:0,startedAt:Date.now()};clearInterval(tick);tick=setInterval(paint,250);paint()}
function trackerPause(){if(!active?.running)return;active.acc+=performance.now()-active.start;active.running=false;paint()}
function trackerResume(){if(!active||active.running)return;active.start=performance.now();active.running=true;paint()}
function trackerStop(saveEntry=false,extra={}){if(!active)return 0;trackerPause();const sec=Math.round(active.acc/1000),m=active;active=null;clearInterval(tick);tick=null;if(saveEntry&&sec>=2){state.history.push({type:'practice',title:m.title,category:m.category,exerciseId:m.exerciseId||null,sessionId:m.sessionId||null,seconds:sec,at:Date.now(),...extra});save()}return sec}
function paint(){const el=document.querySelector('[data-time]');if(el&&active)el.textContent=fmt((active.acc+(active.running?performance.now()-active.start:0))/1000);const b=document.querySelector('[data-toggle]');if(b&&active)b.textContent=active.running?'Ⅱ Pause':'▶ Weiter'}
document.addEventListener('visibilitychange',()=>{if(document.hidden)trackerPause()});
function openExercise(id,opts={}){const e=EX.find(x=>x.id===id);if(!e)return;let bpm=state.bpms[id]||e.bpm,rating='good',started=false;const d=sheet(`<div class="sheethead"><div><div class="eyebrow">${esc(e.category)} · ${esc(e.level)}</div><h2>${esc(e.title)}</h2></div><button class="close" data-close>×</button></div><p>${esc(e.goal)}</p><div class="note"><b>So übst du</b><br>${esc(e.detail)}</div><div class="card" style="margin-top:12px;text-align:center"><div class="eyebrow">ECHTE AKTIVE ZEIT</div><div class="timer" data-time>0:00</div><button class="primary dark full" data-toggle>▶ Übung starten</button></div><div class="card" style="margin-top:10px;text-align:center"><div class="eyebrow">ARBEITSTEMPO</div><div class="bpm" data-bpm>${bpm} BPM</div><div class="controls"><button class="secondary" data-bpmchg="-5">−5</button><button class="primary dark" data-metro>♩ Metronom</button><button class="secondary" data-bpmchg="5">+5</button></div></div><div class="tabwrap"><pre class="tab">${esc(e.tab)}</pre></div>${e.jam?`<button class="secondary full" data-openjam="${e.jam}">▶ Passenden Backing Track öffnen</button>`:''}<div class="rating"><button data-rate="hard">Zu schwer</button><button data-rate="good" class="sel">Sauber</button><button data-rate="easy">Zu leicht</button></div><button class="primary dark full" data-save disabled>Durchgang speichern</button><button class="secondary full" data-fav style="margin-top:8px">${state.favorites[id]?'★ Favorit':'☆ Favorit'}</button>`);d.querySelector('[data-toggle]').onclick=()=>{if(!started){started=true;trackerStart({title:e.title,category:e.category,exerciseId:e.id,sessionId:opts.sessionId||null});d.querySelector('[data-save]').disabled=false}else active?.running?trackerPause():trackerResume();paint()};d.querySelectorAll('[data-bpmchg]').forEach(b=>b.onclick=()=>{bpm=Math.max(30,Math.min(240,bpm+Number(b.dataset.bpmchg)));state.bpms[id]=bpm;save();d.querySelector('[data-bpm]').textContent=bpm+' BPM';if(metroTimer)startMetro(bpm)});d.querySelector('[data-metro]').onclick=()=>toggleMetro(bpm,d.querySelector('[data-metro]'));d.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{rating=b.dataset.rate;d.querySelectorAll('[data-rate]').forEach(x=>x.classList.toggle('sel',x===b))});d.querySelector('[data-fav]').onclick=b=>{state.favorites[id]=!state.favorites[id];save();b.currentTarget.textContent=state.favorites[id]?'★ Favorit':'☆ Favorit'};d.querySelector('[data-openjam]')?.addEventListener('click',b=>openJam(b.currentTarget.dataset.openjam,true));d.querySelector('[data-save]').onclick=()=>{const sec=trackerStop(true,{rating,bpm});state.bpms[id]=rating==='easy'?Math.min(240,bpm+5):rating==='hard'?Math.max(30,bpm-5):bpm;if(opts.sessionId&&state.activeSession){const it=state.activeSession.items.find(x=>x.id===id);if(it){it.done=true;it.seconds=(it.seconds||0)+sec}}save();closeSheet(d);render()};d._beforeClose=()=>{if(active?.exerciseId===id)trackerStop(true,{rating,bpm,completed:false})}}
function openSession(){if(!state.activeSession){state.activeSession={id:'s'+Date.now(),items:makeSession().map(e=>({id:e.id,done:false,seconds:0})),startedAt:Date.now()};save()}const s=state.activeSession;const d=sheet(sessionHtml(s));bindSession(d)}
function sessionHtml(s){const done=s.items.filter(i=>i.done).length,actual=hist().filter(h=>h.sessionId===s.id).reduce((a,h)=>a+h.seconds,0);return `<div class="sheethead"><div><div class="eyebrow">Tatsächlich ${fmt(actual)}</div><h2>Practice Session</h2></div><button class="close" data-close>×</button></div><div class="note">Der Minutenwert ist nur eine Planung. Gespeichert wird ausschließlich deine echte aktive Zeit.</div><div class="card" style="margin-top:10px">${s.items.map((i,n)=>{const e=EX.find(x=>x.id===i.id);return `<button class="sessionitem" data-sx="${i.id}" style="width:100%;border:0;background:none;text-align:left"><div class="num">${i.done?'✓':n+1}</div><div class="grow"><b>${esc(e.title)}</b><div class="sub">${esc(e.category)}${i.done?` · ${fmt(i.seconds)}`:''}</div></div><span>›</span></button>`}).join('')}</div><button class="primary dark full" data-finish style="margin-top:10px">Session beenden (${done}/${s.items.length})</button><button class="secondary full danger" data-discard style="margin-top:8px">Session verwerfen</button>`}
function bindSession(d){d.querySelectorAll('[data-sx]').forEach(b=>b.onclick=()=>openExercise(b.dataset.sx,{sessionId:state.activeSession.id}));d.querySelector('[data-finish]').onclick=()=>{const s=state.activeSession,sec=hist().filter(h=>h.sessionId===s.id).reduce((a,h)=>a+h.seconds,0);if(sec<2)return alert('Noch keine aktive Übungszeit erfasst.');state.activeSession=null;save();closeSheet(d);render();sheet(`<div class="sheethead"><div><div class="eyebrow">Session beendet</div><h2>${fmt(sec)} gespielt</h2></div><button class="close" data-close>×</button></div><div class="note">Die nächste Empfehlung berücksichtigt diese echte Zeit und deine Bewertungen.</div>`)};d.querySelector('[data-discard]').onclick=()=>{state.activeSession=null;save();closeSheet(d);render()}}
function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function clickSound(t,accent=false){const c=ensureAudio(),o=c.createOscillator(),g=c.createGain();o.frequency.value=accent?1400:950;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(accent?.14:.08,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+.06);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.07)}
function startMetro(bpm){stopMetro();const c=ensureAudio(),step=()=>{clickSound(c.currentTime,true)};step();metroTimer=setInterval(step,60000/bpm)}function stopMetro(){if(metroTimer){clearInterval(metroTimer);metroTimer=null}}function toggleMetro(bpm,b){if(metroTimer){stopMetro();b.textContent='♩ Metronom'}else{startMetro(bpm);b.textContent='■ Stop'}}
function stopAudio(){stopMetro();stopJam();}
const chordRoots={'C':48,'D':50,'E':52,'F':53,'G':55,'A':57,'B':59};
function rootMidi(ch){const m=ch.match(/^([A-G])(#|b)?/);if(!m)return 45;let n=chordRoots[m[1]]||48;if(m[2]==='#')n++;if(m[2]==='b')n--;return n}
function tone(midi,t,dur=.18,type='triangle',gain=.045){const c=ensureAudio(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(midi-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.02);jamNodes.push(o)}
function drum(t,kind){const c=ensureAudio();if(kind==='kick'){tone(36,t,.1,'sine',.14)}else if(kind==='snare'){const b=c.createBuffer(1,c.sampleRate*.08,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=.08;s.connect(g).connect(c.destination);s.start(t);jamNodes.push(s)}else tone(82,t,.035,'square',.018)}
function stopJam(){if(jamTimer){clearInterval(jamTimer);jamTimer=null}jamNodes.forEach(n=>{try{n.stop()}catch{}});jamNodes=[]}
function scheduleBar(j,bpm,barIndex,cb){const c=ensureAudio(),beat=60/bpm,now=c.currentTime+.04,ch=j.progression.length?j.progression[barIndex%j.progression.length]:null;for(let k=0;k<4;k++){drum(now+k*beat,k===0?'kick':k===2?'snare':'hat');if(k===1||k===3)drum(now+k*beat,'hat');if(ch&&k===0){const r=rootMidi(ch);tone(r-12,now,.32,'sine',.07);tone(r,now,.28,'triangle',.028);tone(r+7,now,.28,'triangle',.02)}}cb?.(barIndex,ch)}
function openJam(id,overlay=false){const j=JAMS.find(x=>x.id===id);if(!j)return;let bpm=j.bpm,bar=0,running=false;const d=sheet(`<div class="sheethead"><div><div class="eyebrow">${esc(j.style)} · ${esc(j.key)}</div><h2>${esc(j.name)}</h2></div><button class="close" data-close>×</button></div><p>${esc(j.desc)}</p><div class="card jamhero"><div class="nowchord" data-now>–</div><div class="progression">${j.progression.length?j.progression.map((c,i)=>`<span data-bar="${i}">${esc(c)}</span>`).join(''):'<span>Drums only</span>'}</div><div style="text-align:center"><div class="bpm" data-jbpm>${bpm} BPM</div><div class="controls"><button class="secondary" data-jchg="-5">−5</button><button class="primary dark" data-jplay>▶ Start</button><button class="secondary" data-jchg="5">+5</button></div></div></div>`);function paintBar(i,ch){d.querySelector('[data-now]').textContent=ch||'DRUMS';d.querySelectorAll('[data-bar]').forEach(x=>x.classList.toggle('on',Number(x.dataset.bar)===i%(j.progression.length||1)))}function start(){stopJam();running=true;bar=0;scheduleBar(j,bpm,bar++,paintBar);jamTimer=setInterval(()=>scheduleBar(j,bpm,bar++,paintBar),240000/bpm)}d.querySelector('[data-jplay]').onclick=b=>{if(running){running=false;stopJam();b.currentTarget.textContent='▶ Start'}else{start();b.currentTarget.textContent='■ Stop'}};d.querySelectorAll('[data-jchg]').forEach(b=>b.onclick=()=>{bpm=Math.max(50,Math.min(180,bpm+Number(b.dataset.jchg)));d.querySelector('[data-jbpm]').textContent=bpm+' BPM';if(running)start()});d._beforeClose=()=>stopJam()}
function openTool(t){if(t==='metro')return metroTool();if(t==='tuner')return tunerTool();if(t==='timer')return freeTimer();backupTool()}
function metroTool(){let bpm=80,taps=[];const d=sheet(`<div class="sheethead"><h2>Metronom</h2><button class="close" data-close>×</button></div><div class="card" style="text-align:center"><div class="bpm" data-mbpm>80 BPM</div><div class="controls"><button class="secondary" data-mchg="-5">−5</button><button class="primary dark" data-mplay>▶ Start</button><button class="secondary" data-mchg="5">+5</button><button class="secondary" data-tap>Tap</button></div></div>`);d.querySelectorAll('[data-mchg]').forEach(b=>b.onclick=()=>{bpm=Math.max(30,Math.min(240,bpm+Number(b.dataset.mchg)));d.querySelector('[data-mbpm]').textContent=bpm+' BPM';if(metroTimer)startMetro(bpm)});d.querySelector('[data-mplay]').onclick=b=>toggleMetro(bpm,b.currentTarget);d.querySelector('[data-tap]').onclick=()=>{const n=performance.now();taps=taps.filter(x=>n-x<3000);taps.push(n);if(taps.length>1){const avg=(taps[taps.length-1]-taps[0])/(taps.length-1);bpm=Math.round(60000/avg);d.querySelector('[data-mbpm]').textContent=bpm+' BPM'}}}
function autoCorrelate(buf,rate){let rms=0;for(const x of buf)rms+=x*x;rms=Math.sqrt(rms/buf.length);if(rms<.01)return -1;let best=-1,bestCorr=0;for(let off=20;off<1000;off++){let corr=0;for(let i=0;i<buf.length-off;i++)corr+=buf[i]*buf[i+off];if(corr>bestCorr){bestCorr=corr;best=off}}return bestCorr>.01?rate/best:-1}
async function tunerTool(){const d=sheet(`<div class="sheethead"><h2>Tuner</h2><button class="close" data-close>×</button></div><div class="card"><div class="tunerNote" data-note>–</div><div class="subtitle" style="text-align:center" data-cents>Mikrofon starten</div><div class="meter"><i class="needle" data-needle></i></div><button class="primary dark full" data-tstart style="margin-top:14px">Mikrofon starten</button></div>`);d.querySelector('[data-tstart]').onclick=async()=>{try{tunerStream=await navigator.mediaDevices.getUserMedia({audio:true});const c=ensureAudio(),src=c.createMediaStreamSource(tunerStream),an=c.createAnalyser();an.fftSize=2048;src.connect(an);const buf=new Float32Array(an.fftSize);const loop=()=>{an.getFloatTimeDomainData(buf);const f=autoCorrelate(buf,c.sampleRate);if(f>0){const midi=Math.round(69+12*Math.log2(f/440)),cents=Math.round(1200*Math.log2(f/(440*Math.pow(2,(midi-69)/12)))),name=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][((midi%12)+12)%12];d.querySelector('[data-note]').textContent=name;d.querySelector('[data-cents]').textContent=(cents>0?'+':'')+cents+' cents';d.querySelector('[data-needle]').style.left=(50+Math.max(-45,Math.min(45,cents*.9)))+'%'}tunerFrame=requestAnimationFrame(loop)};loop()}catch(e){alert('Mikrofonzugriff nicht möglich. Für iPhone/iPad die PWA über HTTPS öffnen.')}};d._beforeClose=()=>{cancelAnimationFrame(tunerFrame);tunerStream?.getTracks().forEach(t=>t.stop());tunerStream=null}}
function freeTimer(){let started=false;const d=sheet(`<div class="sheethead"><h2>Freie Practice</h2><button class="close" data-close>×</button></div><div class="card" style="text-align:center"><div class="timer" data-time>0:00</div><button class="primary dark full" data-toggle>▶ Start</button></div><button class="primary full" data-freesave disabled style="margin-top:10px">Speichern</button>`);d.querySelector('[data-toggle]').onclick=()=>{if(!started){started=true;trackerStart({title:'Freie Practice',category:'Free Practice'});d.querySelector('[data-freesave]').disabled=false}else active?.running?trackerPause():trackerResume();paint()};d.querySelector('[data-freesave]').onclick=()=>{trackerStop(true,{rating:'neutral'});closeSheet(d);render()};d._beforeClose=()=>{if(active?.category==='Free Practice')trackerStop(true,{rating:'neutral',completed:false})}}
function backupTool(){const d=sheet(`<div class="sheethead"><h2>Backup</h2><button class="close" data-close>×</button></div><div class="note">Export enthält Fortschritt, echte Zeiten, Favoriten, BPM-Werte und Einstellungen.</div><button class="primary dark full" data-export style="margin-top:12px">JSON exportieren</button><label class="secondary full" style="display:block;text-align:center;margin-top:8px">JSON importieren<input type="file" accept="application/json" data-import hidden></label>`);d.querySelector('[data-export]').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PLAY-guitar-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};d.querySelector('[data-import]').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(!obj||!obj.profile||!Array.isArray(obj.history))throw 0;state=Object.assign(structuredClone(defaultState),obj);save();closeSheet(d);render()}catch{alert('Backup-Datei ungültig.')}}}
function settings(){const d=sheet(`<div class="sheethead"><h2>Einstellungen</h2><button class="close" data-close>×</button></div><label>Session-Richtwert<select data-min style="width:100%;font-size:16px;padding:12px;border-radius:12px;margin:6px 0 14px">${[10,15,20,30,45,60].map(x=>`<option ${x===+state.profile.minutes?'selected':''}>${x}</option>`).join('')}</select></label><button class="primary dark full" data-set>Speichern</button>`);d.querySelector('[data-set]').onclick=()=>{state.profile.minutes=+d.querySelector('[data-min]').value;save();closeSheet(d);render()}}
try{render()}catch(e){console.error(e);document.getElementById('app').innerHTML=`<main class="app"><section class="hero"><h1>Startfehler</h1><p>${esc(e.message||e)}</p></section></main>`}
</script><script>if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
